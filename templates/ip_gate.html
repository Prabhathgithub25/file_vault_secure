<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geo Vault Pro - IP Check</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url("{{ url_for('static', filename='bg.jpg') }}");
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      color: #fff;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 15px 30px;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .navbar .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: #f4c10f;
    }

    .navbar .navbar-left a {
      margin-left: 20px;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.3s ease;
    }

    .navbar .navbar-left a:hover {
      color: #f4c10f;
    }

     .back-btn-container {
      position: fixed;
      top: 80px;
      right: 20px;
      z-index: 1000;
    }

    .back-btn {
      background-color: #444;
      color: white;
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .back-btn:hover {
      background-color: #f4c10f;
      color: #111;
    }

    .flash {
      margin: 10px auto;
      width: 90%;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      max-width: 900px;
    }

    .flash.success {
      background-color: rgba(212, 237, 218, 0.85);
      color: #155724;
    }

    .flash.error {
      background-color: rgba(248, 215, 218, 0.85);
      color: #721c24;
    }

    .container {
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .form-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 100%;
      max-width: 500px;
    }

    .form-box h2 {
      margin-bottom: 20px;
      font-size: 1.4rem;
      text-align: center;
    }

    .form-box input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0 20px;
      border-radius: 6px;
      border: none;
      background-color: rgba(255,255,255,0.85);
      font-size: 0.95rem;
      color: #111;
    }

    .form-box input::placeholder {
      color: #555;
    }

    .form-box button {
      background-color: #f4c10f;
      color: #000;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 10px;
    }

    .form-box button:hover {
      background-color: #ffdb4d;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }

      .navbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .navbar .navbar-left {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- === NAVBAR === -->
  <div class="navbar">
    <div class="logo">Geo Vault Pro</div>
    <div class="navbar-left">
      <a href="{{ url_for('home') }}">HOME</a>
      <a href="{{ url_for('ip_gate') }}">LAT&LON</a>
      <a href="{{ url_for('open_locked') }}">FOLDERS</a>
      <a href="{{ url_for('downloadfiles') }}">DECRYPTED FILES</a>
      <a href="/about">ABOUT-US</a>
     <a href="{{ url_for('logout') }}">LOGOUT</a>
    </div>
  </div>

  <!-- === BACK BUTTON === -->
  <div class="back-btn-container">
    <button class="back-btn" onclick="history.back()">← Back</button>
  </div>

  <!-- === FLASH MESSAGES === -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <!-- === MAIN CONTENT === -->
  <div class="container">
    <div class="form-box">
      <h2>🔐 IP Address Check</h2>
      <form method="POST">
        <input
          type="text"
          name="ip_address"
          id="ipBox"
          placeholder="Enter IP Address"
          required
        />
        <div style="text-align:center;">
          <button type="button" onclick="autoFill()">Auto Detect</button>
          <button type="submit">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- === AUTO-FILL SCRIPT === -->
  <script>
    function autoFill() {
      document.getElementById("ipBox").value = "{{ client_ip }}";
    }
  </script>

</body>
</html>
